# ============================================================
# Пул вопросов к вступительному экзамену по специальности
# 1.2.1 «Искусственный интеллект и машинное обучение»
#
# Формат вопросов:
#   Каждый вопрос представляет собой словарь с ключами:
#     - question: "текст вопроса"   (обязательно)
#     - options:                    (необязательно)
#         - answer: "вариант 1"
#         - answer: "вариант 2"
#         ...
#     - correct:                    (обязательно)
#         * если есть options — список индексов правильных вариантов (с нуля),
#           например [0, 2] для множественного выбора;
#         * если options нет — строка с точным ответом (или регулярное выражение,
#           если требуется).
#     - accept:                     (необязательно, только для свободного ввода)
#         список дополнительных принимаемых вариантов ответа (синонимы,
#         альтернативные формулировки).
#
# Примеры:
#   1. Множественный выбор:
#      - question: "Какие из следующих алгоритмов относятся к обучению с учителем?"
#        options:
#          - answer: "Линейная регрессия"
#          - answer: "K-means"
#          - answer: "SVM"
#          - answer: "PCA"
#        correct: [0, 2]
#
#   2. Свободный ввод:
#      - question: "Назовите функцию потерь, используемую в логистической регрессии."
#        correct: "LogLoss"
#        accept:
#          - "логистическая функция потерь"
#          - "binary cross-entropy"
#          - "кросс-энтропия"
# ============================================================

