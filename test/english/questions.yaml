exam_subject: "ПО ИНОСТРАННОМУ ЯЗЫКУ (АНГЛИЙСКИЙ)"

# ============================================================
# Пул вопросов к вступительному экзамену в аспирантуру ДГТУ
# по иностранному языку (английский язык)
#
# Разделы программы:
#   1. Грамматика (16 тем)
#   2. Лексика (научная и общеупотребительная терминология)
#   3. Чтение (изучающее, поисковое, просмотровое)
#   4. Перевод (научно-технический текст)
#
# Формат вопросов:
# Каждый вопрос представляет собой словарь с ключами:
#   - question: "текст вопроса" (обязательно)
#   - options: (необязательно)
#       - answer: "вариант 1"
#       - answer: "вариант 2"
#       ...
#   - correct: (обязательно)
#       * если есть options — список индексов правильных вариантов (с нуля),
#         например [0, 2] для множественного выбора;
#       * если options нет — строка с точным ответом.
#   - accept: (необязательно, только для свободного ввода)
#       список дополнительных принимаемых вариантов ответа.
# ============================================================

